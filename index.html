<script>
const DATA = {"QC": [{"n": 1, "area": "Competenze fondamentali", "tabTitle": "Agire da facilitatore culturale nello svolgimento delle proprie mansioni", "tabDesc": "Agire come professionista colto che sia al tempo stesso interprete, facilitatore e critico della cultura nell’esercizio delle proprie funzioni.", "title": "Agire come mediatore culturale nell’esercizio delle proprie funzioni", "sub": "Agire come professionista colto che sia al tempo stesso interprete, facilitatore e critico della cultura nell’esercizio delle proprie funzioni.", "ob": ["Integrando riferimenti culturali ricchi e significativi nelle situazioni didattiche e adottando un approccio culturale all’insegnamento, gli insegnanti consentono agli studenti di scoprire o comprendere meglio i diversi aspetti della cultura, in particolare quelli relativi alla materia insegnata, ovvero conoscenze e competenze, pratiche, strumenti e tecniche, metodi e procedure, la storia della materia, nonché le questioni, i risultati raggiunti, le figure chiave, le scuole di pensiero e i dibattiti che ne hanno segnato lo sviluppo. Allo stesso modo, gli insegnanti contribuiscono a costruire il significato e il valore che gli studenti attribuiscono alla cultura e li incoraggiano a guardarla con occhio critico. In questo modo, gli insegnanti consentono agli studenti di costruire la propria identità e di comprendere gli altri, nonché la cultura e la società in cui vivono."], "de": ["Il lavoro degli insegnanti in qualità di professionisti colti, interpreti, facilitatori e critici della cultura consiste nell’introdurre gli studenti a una varietà di riferimenti culturali che fanno parte del patrimonio mondiale dell’umanità; nel rendere esplicito e pertinente il significato degli oggetti culturali; nel creare collegamenti tra questi oggetti, i contenuti didattici e la cultura giovanile; e nell’incoraggiare gli studenti ad assumere un atteggiamento critico e riflessivo nei confronti della cultura.", "Più specificamente, gli insegnanti devono decodificare e interpretare, diffondere e distribuire, selezionare, descrivere, tradurre, spiegare, criticare, contestualizzare e chiarire gli oggetti culturali, oltre a dar loro vita e renderli accessibili, in modo da offrire agli studenti situazioni didattiche e di apprendimento che li aiutino a costruire un rapporto con la cultura (Simard e Mellouki 2005)."], "el": ["Dimostra una comprensione approfondita dei contenuti del Programma Educativo del Québec, in particolare di quelli relativi alla disciplina di insegnamento (teorie, concetti, metodi, strumenti, pratiche, storia, ecc.) e alla sua organizzazione intellettuale, al fine di identificare i punti di riferimento fondamentali e i punti di comprensione con l’obiettivo di facilitare un apprendimento significativo e approfondito da parte degli studenti.", "Dà significato all’apprendimento degli studenti creando collegamenti tra tutto ciò che apprendono in classe, tra la materia insegnata e le altre materie, tra la materia e le opere, le narrazioni e le realizzazioni che fanno parte del patrimonio culturale dei popoli e delle società, nonché tra le questioni sociali, scientifiche, etiche e politiche e le situazioni quotidiane.", "Incoraggia gli studenti a sviluppare il pensiero critico, la prospettiva e la riflessività rispetto al loro ambiente immediato, ai media e al mondo digitale, ai fenomeni sociali, scientifici, artistici, etici e politici, nonché alle opere culturali del passato e del presente.", "Trasforma l’aula in uno spazio culturale inclusivo e stimolante per tutti.", "Incoraggia gli studenti a esprimere e giustificare le proprie rappresentazioni, i propri gusti, i propri riferimenti e le proprie pratiche in ambito culturale.", "Favorisce un dialogo aperto e critico tra la cultura degli studenti e quella trasmessa dalla scuola.", "Getta uno sguardo critico sulle proprie origini e pratiche culturali, ne riconosce il potenziale e i limiti e individua modalità per arricchirle e diversificarle.", "Collabora con la comunità e le organizzazioni culturali locali e conosce le risorse e i programmi che sostengono gli insegnanti nel loro ruolo di facilitatori culturali."], "notes": []}, {"n": 2, "area": "Competenze fondamentali", "tabTitle": "Padroneggiare la lingua di insegnamento", "tabDesc": "Comunicare in modo appropriato nella lingua di insegnamento, sia oralmente che per iscritto, in tutti i contesti legati allo svolgimento delle proprie mansioni.", "title": "Padroneggiare la lingua di insegnamento", "sub": "Comunicare in modo appropriato nella lingua di insegnamento, sia oralmente che per iscritto, in tutti i contesti legati allo svolgimento delle proprie mansioni.", "ob": ["Come la cultura, la padronanza della lingua di insegnamento va ben oltre una semplice competenza tecnica. Questo perché tale lingua non solo rende possibile la comunicazione didattica tra docenti e studenti, ma costituisce anche un mondo simbolico in cui essa stessa si svolge. Di conseguenza, i docenti sono responsabili della qualità del proprio linguaggio parlato e scritto quando comunicano non solo con i propri studenti, ma con chiunque altro (genitori, colleghi, altri professionisti)."], "de": ["Tutte le culture si trasmettono attraverso una lingua. Ecco perché la padronanza completa della lingua di insegnamento è una competenza fondamentale. Infatti, la scuola esiste essenzialmente attraverso una cultura e una lingua viva e in continua evoluzione. Gli insegnanti trasmettono questa lingua agli studenti in vari modi, sia attraverso discussioni, discorsi, teatro, libri, canzoni, quaderni di esercizi, parole e frasi, numeri, immagini o simboli. Con i propri studenti, gli insegnanti non si limitano a parlare o a scrivere una lingua: la presentano e la rappresentano davanti a loro e insieme a loro. In breve, gli insegnanti fungono da modello per la lingua, motivo per cui devono dare il buon esempio esprimendosi bene sia oralmente che per iscritto."], "el": ["Padroneggia le regole e l’uso della lingua parlata e scritta in modo da essere compreso da tutti i membri della comunità.", "Dimostra la capacità di presentare le proprie idee in modo coerente, comprensibile, critico e rispettoso, sia nella comunicazione orale che in quella scritta.", "Utilizza un livello linguistico adeguato nella comunicazione con studenti, genitori e colleghi.", "Inserisce nei programmi didattici strumenti che promuovono la lingua di insegnamento come oggetto culturale.", "Utilizza diverse modalità di espressione linguistica (visiva, spaziale, uditiva e gestuale) per sostenere lo sviluppo delle competenze linguistiche degli studenti.", "Attinge alla lingua madre degli studenti e la valorizza per favorire l’acquisizione della lingua di insegnamento.", "Verifica la qualità dell’espressione linguistica degli studenti, fornisce feedback frequenti e li aiuta a correggersi e a dimostrare la loro capacità di integrare le regole e gli usi della lingua, sia parlata che scritta.", "Comunica in modo chiaro, conciso e costruttivo le conoscenze acquisite e qualsiasi altra informazione che possa aiutare gli studenti nell’apprendimento."], "notes": []}, {"n": 3, "area": "Area 1 - Lavorare con e per gli studenti", "tabTitle": "Pianificare situazioni didattiche e di apprendimento", "tabDesc": "Progettare e pianificare attività e situazioni didattiche e di apprendimento adeguate agli studenti, ai contenuti didattici e agli obiettivi formativi.", "title": "Pianificare situazioni didattiche e di apprendimento", "sub": "Progettare e pianificare attività e situazioni didattiche e di apprendimento adeguate agli studenti, ai contenuti didattici e agli obiettivi formativi.", "ob": ["La progettazione e la pianificazione delle attività e delle situazioni didattiche e di apprendimento rappresentano un momento pedagogico fondamentale in cui gli insegnanti individuano ciò che deve essere messo in atto durante la situazione stessa, al fine di favorire l’apprendimento e garantirne il progresso."], "de": ["La pianificazione consiste nell’ideare e organizzare sequenze didattiche e di apprendimento che mettano in risalto gli elementi dei programmi di studio. Data la diversità degli studenti nelle scuole, la pianificazione comporta anche l’anticipazione dell’uso di strategie didattiche differenziate. Questa pianificazione pone gli insegnanti di fronte a molte scelte relative alla gestione dell’apprendimento e dei comportamenti. Essi organizzano le situazioni didattiche e di apprendimento, selezionano i metodi, redigono le istruzioni, preparano il materiale e stabiliscono quando avranno luogo il feedback e la valutazione. Anche quando gli insegnanti sono ben preparati, le situazioni didattiche e di apprendimento prendono regolarmente pieghe inaspettate. Analizzare questi cambiamenti di direzione aiuta gli insegnanti a pianificare le successive attività e situazioni didattiche e di apprendimento."], "el": ["Sviluppa sequenze e situazioni didattiche che tengano conto della logica organizzativa dei contenuti del programma di studi e delle conoscenze pregresse e delle idee preconcette degli studenti, al fine di pianificare l’apprendimento a breve, medio e lungo termine.", "Individua, nei programmi di studio, i concetti chiave, le strategie, i riferimenti culturali e le conoscenze attorno ai quali saranno organizzate le situazioni didattiche e di apprendimento e li adatta ai propri studenti.", "Garantisce la coerenza tra gli obiettivi educativi, le situazioni didattiche e di apprendimento e i metodi di valutazione previsti.", "Tiene conto della diversità degli studenti nella scelta dei materiali e nella preparazione delle situazioni didattiche (diversità legata al genere, all’etnia, al contesto socio-economico, alla cultura, alla religione, alla lingua o a una disabilità; concezioni, esigenze e aree di interesse degli studenti).", "Pianifica attività per gli studenti in modo che possano elaborare, integrare, trasferire e riutilizzare quanto appreso, al fine di ottimizzare lo sviluppo delle competenze.", "Basa la scelta delle strategie di intervento sui risultati della ricerca nel campo della didattica e della pedagogia.", "Pianifica modalità di presentazione dei contenuti in modo strutturato, affinché gli studenti possano cogliere i punti salienti e comprenderne la natura contingente.", "Garantisce che l’organizzazione spaziale e fisica dell’aula, o di ciò che funge da aula, offra a tutti gli studenti condizioni di apprendimento sicure e ottimali.", "Determina il tempo necessario per ciascuna fase della situazione didattica.", "Nella pianificazione delle lezioni, tiene conto delle attività che possono essere svolte contemporaneamente all’insegnamento in classe (sostegno linguistico, recupero scolastico)."], "notes": []}, {"n": 4, "area": "Area 1 - Lavorare con e per gli studenti", "tabTitle": "Attuare situazioni didattiche e di apprendimento", "tabDesc": "Attuare e supervisionare situazioni didattiche adeguate agli studenti e agli obiettivi formativi.", "title": "Attuare situazioni didattiche", "sub": "Attuare e supervisionare situazioni didattiche adeguate agli studenti e agli obiettivi formativi.", "ob": ["L’attuazione e la supervisione delle situazioni didattiche coincidono con un altro importante momento educativo: le interazioni con il gruppo. L’attuazione e la supervisione riguardano quindi gli interventi concreti dei docenti con i propri studenti, volti ad aiutarli ad apprendere i contenuti del programma di studio."], "de": ["Nell’attuare e supervisionare le situazioni didattiche, gli insegnanti confrontano il proprio piano con gli interessi, i bisogni, le rappresentazioni e le prospettive degli studenti. Pertanto, la prima sfida che gli insegnanti devono affrontare è quella di assicurarsi che tutti gli studenti, individualmente e collettivamente, siano coinvolti nell’apprendimento pianificato sin dall’inizio dell’attività. Per mantenere vivo il coinvolgimento degli studenti, gli insegnanti prestano attenzione, durante l’interazione in classe, ai segnali che indicano che gli studenti non prestano attenzione o non comprendono. Gli insegnanti pongono domande agli studenti, li incoraggiano e li sostengono attivamente. Gli insegnanti, in quanto professionisti autonomi, sono liberi di «scegliere metodi didattici corrispondenti ai requisiti e agli obiettivi fissati per ciascun gruppo o per ciascun alunno affidato alle loro cure» (Legge sull’istruzione, art. 19). L’attuazione e la supervisione di una situazione didattica sono quindi impegnative, in particolare perché gli insegnanti devono essere sempre pronti ad affrontare eventuali situazioni impreviste che possono sorgere durante le interazioni in classe e mobilitare appieno la loro capacità di adattarsi alla situazione."], "el": ["Informa gli studenti riguardo all’obiettivo educativo delle situazioni didattiche, alle competenze previste, alle istruzioni, alle aspettative, al processo e al rapporto tra tali situazioni e il loro apprendimento precedente e futuro.", "Mette in luce le idee preconcette degli studenti e riattiva le conoscenze pregresse necessarie per le situazioni didattiche.", "Utilizza approcci e strategie diversificati e propone una varietà di attività stimolanti per stimolare e mantenere il coinvolgimento attivo degli studenti nell’attività e per promuovere la loro autonomia.", "Utilizza il feedback per verificare costantemente la comprensione da parte degli studenti di concetti, conoscenze, strategie o regole.", "Adatta i propri metodi di lavoro tenendo conto della natura delle competenze da sviluppare, della complessità dell’attività, del tempo a disposizione e del livello di successo degli studenti.", "Offre opportunità di feedback al fine di promuovere la capacità degli studenti di sintetizzare il proprio apprendimento."], "notes": []}, {"n": 5, "area": "Area 1 - Lavorare con e per gli studenti", "tabTitle": "Valutare l’apprendimento", "tabDesc": "Sviluppare, scegliere e utilizzare diversi metodi per valutare l’acquisizione delle conoscenze e lo sviluppo delle competenze.", "title": "Valutare l’apprendimento", "sub": "Sviluppare, scegliere e utilizzare diversi metodi per valutare l’acquisizione delle conoscenze e lo sviluppo delle competenze.", "ob": ["La valutazione ha due funzioni principali, ovvero sostenere l’apprendimento e riconoscere le competenze (Ministère de l’Éducation 2003). Queste due funzioni sono complementari e l’obiettivo di ciascuna è facilitare l’apprendimento.", "In pratica, la valutazione intesa come supporto favorisce la regolazione dell’apprendimento e l’attuazione di metodi di valutazione differenziati al fine di rispondere alle diverse esigenze degli studenti. Lo scopo della valutazione intesa come riconoscimento delle competenze è verificare se sia stato raggiunto il livello previsto di sviluppo delle competenze. Inoltre, tale riconoscimento costituisce la base per il processo decisionale relativo alla certificazione degli studi, una responsabilità condivisa tra i docenti e le autorità preposte al rilascio dei diplomi."], "de": ["La valutazione dell’apprendimento si basa sul giudizio professionale dei docenti che, raccogliendo una quantità sufficiente di informazioni diverse ma pertinenti, saranno in grado di analizzare e interpretare tali informazioni per valutare l’apprendimento dei propri studenti. Sia che la valutazione venga effettuata in modo formale o informale, in conformità con le condizioni specifiche di ciascuna materia, essa deve essere in linea con gli obiettivi educativi delle politiche in materia di valutazione dell’apprendimento.", "Gli insegnanti valutano continuamente l’apprendimento utilizzando strumenti o metodi che consentono loro di raccogliere informazioni significative sull’apprendimento degli studenti e che spesso richiedono la loro capacità di agire in modo autonomo e di assumersi responsabilità. La valutazione presenta anche un aspetto emotivo che gli insegnanti devono comprendere, soprattutto per quanto riguarda il suo impatto sulla motivazione e sul coinvolgimento degli studenti nell’apprendimento, nonché nella comunicazione dei risultati agli studenti e ai loro genitori.", "Per tutte queste ragioni, la valutazione dell’apprendimento non può essere spontanea; essa si apprende e si perfeziona attraverso la pratica e la formazione continua. La valutazione deve inoltre essere integrata nella pianificazione delle situazioni didattiche e di apprendimento, al fine di garantire la coerenza tra ciò che l’insegnante intende valutare e ciò che lo studente deve apprendere."], "el": ["Progetta o sceglie strumenti o metodi di valutazione basati sui programmi di studio e che consentano di verificare l’apprendimento degli studenti.", "Utilizza metodi di valutazione adeguati all’oggetto da valutare.", "Progetta o sceglie strumenti di valutazione significativi per gli studenti.", "Individua i punti di forza e le difficoltà degli studenti e pianifica interventi adeguati che favoriscano il loro apprendimento.", "Utilizza le informazioni raccolte tramite diversi metodi di valutazione per ottenere un quadro d’insieme del gruppo e pianificare l’insegnamento di conseguenza.", "Fornisce agli studenti un feedback frequente e costruttivo che consenta loro di monitorare il proprio apprendimento e sostenga i loro progressi.", "Prevede di utilizzare una varietà di metodi di valutazione per offrire a tutti gli studenti l’opportunità di dimostrare le conoscenze acquisite.", "Conosce le linee guida ministeriali relative alla valutazione degli studenti.", "Conosce e soddisfa le aspettative delle autorità scolastiche in materia di condivisione e assunzione delle responsabilità relative alla valutazione e alla comunicazione dei risultati della valutazione."], "notes": []}, {"n": 6, "area": "Area 1 - Lavorare con e per gli studenti", "tabTitle": "Gestire il funzionamento della classe", "tabDesc": "Organizzare e gestire una classe in modo da massimizzare lo sviluppo, l’apprendimento e la socializzazione degli studenti.", "title": "Gestire il funzionamento della classe", "sub": "Organizzare e gestire una classe in modo da massimizzare lo sviluppo, l’apprendimento e la socializzazione degli studenti.", "ob": ["La gestione di una classe comporta la stessa azione della gestione dell’apprendimento: l’interazione con il gruppo. In questo senso, si tratta di un’attività sociale o collaborativa che consente agli insegnanti di favorire la socializzazione dei propri studenti e di impartire loro l’insegnamento. La gestione della classe consente agli insegnanti di ottimizzare il tempo dedicato all’apprendimento, uno dei fattori chiave del successo degli studenti (Bissonnette, Gauthier e Castonguay 2016). Gli insegnanti insegnano ai propri studenti a identificare e rispettare le regole della convivenza, aiutandoli a sviluppare le competenze sociali che stanno alla base della capacità di vivere insieme: avere rispetto per gli altri con l’ascolto attento e l’empatia che ciò presuppone, conoscere i limiti da non superare e le regole da rispettare, gestire le proprie emozioni, ecc."], "de": ["La gestione di una classe comporta la gestione del tempo, dello spazio e delle relazioni con e tra gli studenti.", "Per organizzare e gestire le proprie classi, gli insegnanti definiscono, in collaborazione con i propri studenti, un quadro operativo generale che sia flessibile e aperto. In particolare, gli insegnanti strutturano l’ambiente, applicano una serie di regole basate su valori espliciti, anticipano e gestiscono eventuali comportamenti scorretti, ecc. In questo modo, dirigono e guidano le attività in classe e i comportamenti appropriati necessari per vivere in una comunità. Si occupano inoltre delle emozioni dei propri studenti (ansia, rabbia, frustrazione, gioia, tristezza, timidezza, ecc.).", "Nel fornire l’insegnamento, gli insegnanti devono anche gestire il tempo, lo spazio e le rispettive realtà (aula, palestra, laboratorio, durata delle lezioni, ecc.). Devono sfruttare al meglio i materiali a disposizione (banchi, sedie, tavoli, lavagne interattive, ecc.) e gestire efficacemente i movimenti e i passaggi degli studenti al fine di ottimizzare il tempo dedicato all’apprendimento. Il tempo dedicato all’insegnamento in aula deve essere coordinato con altre attività che si svolgono contemporaneamente al di fuori dell’aula.", "Pertanto, la composizione del gruppo di studenti e il contesto in cui esso si inserisce influiscono sul modo in cui gli insegnanti gestiscono la classe. Per gestire una classe, gli insegnanti devono apportare numerosi adeguamenti durante l’attività e riflettervi in seguito."], "el": ["Costruisce e mantiene relazioni positive con gli studenti al fine di stimolare il loro impegno e il loro contributo alla gestione della classe.", "Instaura, in collaborazione con gli studenti, un clima di classe rispettoso e rassicurante che favorisca l’apprendimento, e rivede periodicamente con gli studenti i comportamenti che ci si aspetta da loro.", "Aiuta gli studenti a riconoscere e gestire in modo appropriato i propri comportamenti e le proprie emozioni.", "Sceglie e mette in atto attività che consentano agli studenti di sviluppare le proprie competenze sociali e relazionali.", "Individua i segnali di scarsa motivazione o incomprensione negli studenti e adotta le misure necessarie per porre rimedio alla situazione.", "Garantisce che il tempo dedicato all’insegnamento e all’apprendimento sia gestito in modo efficace.", "Gestisce l’organizzazione spaziale e fisica dell’aula al fine di garantire agli studenti condizioni di apprendimento sicure e ottimali.", "Ricorda agli studenti le misure di sicurezza stabilite e ne garantisce il rispetto, in particolare per le attività che si svolgono in palestra, in laboratorio o in officina, oppure durante le gite scolastiche.", "Registra i fatti relativi a comportamenti inappropriati degli studenti e ne segue l’evoluzione."], "notes": []}, {"n": 7, "area": "Area 1 - Lavorare con e per gli studenti", "tabTitle": "Tenere conto della diversità degli studenti", "tabDesc": "Attuare, nell’ambito di un approccio didattico inclusivo, strategie volte a differenziare le pratiche didattiche in modo da favorire la piena partecipazione e il successo di tutti gli studenti.", "title": "Tenere conto della diversità degli studenti", "sub": "Attuare, nell’ambito di un approccio didattico inclusivo, strategie volte a differenziare le pratiche didattiche in modo da favorire la piena partecipazione e il successo di tutti gli studenti.", "ob": ["Nel senso più ampio del termine, tenere conto della diversità degli studenti significa che gli insegnanti devono attuare una serie di misure che consentano loro di adattarsi a tutti i diversi tipi di studenti che incontrano, tenendo presente il contesto in cui operano. Ciò permette agli insegnanti di offrire una varietà di contenuti, strutture, attività e processi adattati alle esigenze degli studenti, indipendentemente dalle loro differenze, in modo da favorire il loro successo e sostenere il loro sviluppo nel miglior modo possibile. Inoltre, gli insegnanti devono trovare un equilibrio tra gli interventi personalizzati e quelli rivolti all’intera classe, in modo che ogni singolo studente si senta riconosciuto per quello che è e coinvolto in un’attività comune che riunisca tutti."], "de": ["Rispondere alla diversità degli studenti significa tenere conto di tutte le questioni relative all’educazione inclusiva. Non tutte le differenze tra gli studenti presentano le stesse sfide educative, poiché non sono tutte dello stesso tipo e non richiedono gli stessi tipi di interventi. Tuttavia, sarebbe utile concentrarsi qui sugli aspetti che rendono la differenziazione una parte indispensabile dell’insegnamento. Tenere conto della diversità degli studenti implica il rispetto della diversità e apre la strada a una migliore socializzazione e, in ultima analisi, al successo scolastico.", "Parte 6", "Data questa crescente diversità, l’uso di pratiche didattiche differenziate diventa una competenza chiave per gli insegnanti. La didattica differenziata deve inoltre essere attuata in collaborazione con servizi educativi complementari (sostegno scolastico, logopedia, psicologia, ecc.), di cui alcuni studenti hanno bisogno per raggiungere il successo. In questo contesto, la condivisione collettiva delle responsabilità risulta particolarmente appropriata. Pertanto, in linea con i rispettivi ruoli e responsabilità, i diversi attori del sistema educativo possono agire in collaborazione per favorire il successo di tutti gli studenti."], "el": ["Adatta le situazioni didattiche e di apprendimento e il sostegno offerto agli studenti in base alle loro esigenze, difficoltà e capacità.", "Utilizza le risorse disponibili per soddisfare le esigenze o superare specifici ostacoli all’apprendimento.", "Raggruppa gli studenti in modo da tenere conto degli obiettivi educativi e delle esigenze di apprendimento differenziate degli studenti.", "Ricorre a misure di flessibilità pedagogica, adattamento e modifica per rispondere alle esigenze specifiche degli studenti in conformità con gli obiettivi prestabiliti.", "Promuove strategie di aiuto reciproco all’interno della classe che valorizzino la diversità degli studenti e siano vantaggiose per tutti.", "Si consulta con esperti, genitori o documenti pertinenti per ottenere informazioni relative alle esigenze e ai percorsi formativi degli studenti e tiene conto di tali informazioni nella propria attività didattica.", "Adotta le procedure appropriate per richiedere servizi a favore degli studenti con disadattamenti sociali o difficoltà di apprendimento, oppure degli studenti che mostrano segni di menomazioni o disabilità.", "Attua piani educativi o di sostegno all’apprendimento personalizzati in collaborazione con il team scolastico e ne garantisce il monitoraggio."], "notes": []}, {"n": 8, "area": "Area 1 - Lavorare con e per gli studenti", "tabTitle": "Sostenere la passione degli studenti per l’apprendimento", "tabDesc": "Coltivare il naturale desiderio di apprendere degli studenti, il loro senso di scoperta e la loro curiosità creando le condizioni necessarie per aiutare tutti gli studenti a realizzarsi.", "title": "Sostenere la passione degli studenti per l’apprendimento", "sub": "Coltivare il naturale desiderio di apprendere degli studenti, il loro senso di scoperta e la loro curiosità creando le condizioni necessarie per aiutare tutti gli studenti a realizzarsi.", "ob": ["Sostenere la passione degli studenti per l’apprendimento, offrendo situazioni didattiche stimolanti e significative, contribuisce al loro sviluppo complessivo. Rendendo l’apprendimento significativo, gli insegnanti alimentano il desiderio di apprendere degli studenti, che costituisce la pietra angolare del successo educativo."], "de": ["Attraverso le loro pratiche, i loro atteggiamenti e la qualità dei rapporti con gli studenti, gli insegnanti sono in grado di sostenere la curiosità e il desiderio di esplorare degli studenti (Bembenutty e White 2013; Bressoux 2012). Per alimentare l’amore per l’apprendimento e la curiosità degli studenti, gli insegnanti collegano le conoscenze che gli studenti sono chiamati ad acquisire alle loro esperienze e ai loro riferimenti culturali. Un altro modo per rendere significativo l’apprendimento consiste nel far riflettere gli studenti sulla soddisfazione che un apprendimento riuscito darà loro in termini di aspirazioni accademiche e professionali (Develay 1994).", "Inoltre, spetta a tutti coloro che sono responsabili degli studenti (genitori, presidi, personale dei servizi educativi complementari) aiutarli a sviluppare un senso di appartenenza e incoraggiarli a valorizzare l’apprendimento."], "el": ["Costruisce e mantiene relazioni positive con gli studenti al fine di stimolare la loro motivazione all’apprendimento.", "Aiuta gli studenti a sviluppare fiducia nelle proprie capacità di apprendimento, proponendo loro una varietà di esperienze.", "Aiuta gli studenti a perseverare nell’apprendimento sostenendo i loro sforzi e i loro progressi.", "Incoraggia gli studenti a utilizzare strategie di apprendimento che promuovano e favoriscano la loro autonomia.", "Assicura che le situazioni didattiche includano elementi della vita quotidiana e riferimenti culturali familiari agli studenti.", "Stimola l’interesse e la curiosità degli studenti nei confronti della materia, delle conoscenze e delle competenze, delle pratiche, degli strumenti e delle tecniche, dei metodi e delle procedure coinvolti, nonché della storia della materia e delle questioni, dei risultati, delle figure chiave, delle scuole di pensiero e dei dibattiti che ne hanno segnato lo sviluppo.", "Pianifica situazioni didattiche e di apprendimento che suscitino l’entusiasmo degli studenti per le attività didattiche e che possano essere collegate alle loro aree di interesse.", "Promuove il lavoro collaborativo, le discussioni, la partecipazione e l’aiuto reciproco tra gli studenti.", "Aiuta gli studenti a sviluppare un senso di appartenenza coinvolgendoli nelle attività di classe e scolastiche."], "notes": []}, {"n": 9, "area": "Area 2 - Professionalità collaborativa", "tabTitle": "Essere attivamente coinvolti come membri del team scolastico", "tabDesc": "Inserire le proprie attività in un contesto collettivo, al servizio della complementarità e della continuità delle attività didattiche intese come atti educativi.", "title": "Partecipare attivamente come membro del team scolastico", "sub": "Inserire le proprie attività in un contesto collettivo, al servizio della complementarità e della continuità delle attività didattiche intese come atti educativi.", "ob": ["L’insegnamento va oltre l’aula e il rapporto insegnante-studente. Gli insegnanti fanno parte di un team i cui membri sono chiamati a collaborare per prendere decisioni coerenti e coordinare le proprie azioni nell’interesse degli studenti."], "de": ["Per garantire il successo dei propri studenti, gli insegnanti devono collaborare con altri soggetti coinvolti nel processo educativo. In classe o all’interno della scuola, cooperano non solo con i propri colleghi, ma anche con il personale dei servizi educativi di supporto e con il preside,7 sia per decidere in merito ad azioni che riguardano tutti gli studenti, sia per trovare soluzioni ai problemi riscontrati da alcuni di essi.", "Sebbene le condizioni varino notevolmente da un’organizzazione all’altra, la natura altamente collaborativa dell’istruzione richiede che gli insegnanti affermino e assumano pienamente il proprio status di professionisti specializzati nell’istruzione e nell’apprendimento, e che tengano conto delle competenze di altri professionisti dell’istruzione nei loro interventi con gli studenti.", "Al fine di mantenere rapporti professionali costruttivi e armoniosi con i propri colleghi, gli insegnanti devono adottare un atteggiamento aperto e mettere a frutto le proprie capacità relazionali e comunicative."], "el": ["Collabora con i membri del team scolastico nella definizione e nell’adesione agli orientamenti e agli standard educativi che rendono la scuola un ambiente sano, sicuro ed equo.", "Contribuisce a sviluppare, attuare e valutare le politiche, le prassi e i regolamenti che disciplinano il funzionamento della scuola.", "Collabora con i membri del personale scolastico allo sviluppo e all’attuazione del progetto educativo della scuola.", "Si assume le responsabilità previste dal contratto collettivo.", "Lavora con i membri del team scolastico per promuovere, in ogni momento, atteggiamenti e comportamenti positivi, sani e sicuri a scuola.", "Se necessario, collabora con gli altri membri del corpo docente alla progettazione e alla valutazione delle situazioni didattiche e di apprendimento, in conformità con gli standard e i metodi di valutazione in vigore nella scuola.", "Quando richiesto, partecipa all’elaborazione di misure volte a rispondere alle esigenze dei gruppi emarginati o in difficoltà a scuola.", "Partecipa all’elaborazione, all’attuazione, al monitoraggio e alla revisione dei piani educativi individualizzati o di sostegno all’apprendimento."], "notes": []}, {"n": 10, "area": "Area 2 - Professionalità collaborativa", "tabTitle": "Collaborare con la famiglia e i partner educativi della comunità", "tabDesc": "Promuovere e incoraggiare il coinvolgimento dei genitori nell’apprendimento e nella vita scolastica dei propri figli, e contribuisce a instaurare collaborazioni durature tra la scuola e la comunità.", "title": "Collaborare con la famiglia e i partner educativi della comunità", "sub": "Promuovere e incoraggiare il coinvolgimento dei genitori nell’apprendimento e nella vita scolastica dei propri figli, e contribuisce a instaurare collaborazioni durature tra la scuola e la comunità.", "ob": ["Instaurare rapporti costruttivi con la famiglia e i diversi partner della comunità è in linea con lo spirito di collaborazione, in cui il contributo di ciascuno è finalizzato a consolidare e arricchire l’apprendimento degli studenti."], "de": ["Il successo scolastico dipende in parte dal benessere fisico ed emotivo degli studenti, nonché dal loro ambiente familiare. Ciò significa che gli insegnanti devono tenere conto della situazione familiare di ciascuno dei propri studenti. In determinate situazioni, ciò richiede che gli insegnanti li conoscano sia come studenti che come membri di una famiglia e di una comunità. Grazie a questa conoscenza, gli insegnanti possono comprendere più chiaramente come collaborare con queste famiglie per soddisfare al meglio le esigenze dei propri studenti (Epstein 2001).", "Nel caso dei bambini minorenni, gli insegnanti devono inoltre comunicare con i genitori per informarli dei risultati e delle difficoltà dei propri figli, rispondere alle loro domande e ascoltare le loro preoccupazioni, contribuendo così a creare un rapporto di fiducia e uno spazio di dialogo. Inoltre, gli insegnanti incoraggiano i genitori riconoscendo il loro ruolo di educatori dei propri figli, familiarizzandoli con i programmi di studio o coinvolgendoli in varie attività scolastiche.", "La scuola è aperta anche alla comunità. Accoglie con favore le influenze provenienti da varie comunità artistiche, culturali, sportive, scientifiche, mediatiche o professionali.^8^ Tutte queste comunità sono partner educativi di inestimabile valore che integrano e arricchiscono l’apprendimento degli studenti, la conoscenza di sé e l’apertura al mondo (Sanders 2002). Questa apertura, particolarmente importante nelle comunità indigene, incoraggia gli insegnanti a rimanere sempre alla ricerca di opportunità di collaborazione con partner esterni alla scuola e a sviluppare una comprensione più ampia dell’apprendimento."], "el": ["Instaura relazioni costruttive con la famiglia dello studente e con i partner della comunità.", "Mantiene una buona comunicazione con la famiglia riguardo al successo e al benessere degli studenti.", "Comunica alla famiglia le proprie aspettative riguardo ai risultati, agli atteggiamenti e ai comportamenti che ci si aspetta dagli studenti in classe.", "Fornisce alla famiglia i mezzi adeguati per partecipare all’apprendimento dei propri figli, nonché alle attività scolastiche ed extrascolastiche.", "Coglie le opportunità di collaborare con i partner che arricchiscono l’apprendimento e la formazione degli studenti.", "Si assicura che gli obiettivi educativi delle attività proposte da questi partner siano in linea con il Programma Educativo del Québec, il progetto educativo e gli interessi e le esigenze degli studenti, degli insegnanti e della scuola.", "Coglie le opportunità per reinvestire i risultati delle attività di collaborazione nelle situazioni didattiche e di apprendimento."], "notes": [{"n": "8", "t": "Sanders (2019) propone una serie di partner comunitari: imprese; università e altre istituzioni educative; enti governativi; organizzazioni sanitarie e di servizi sociali e servizi di assistenza all’infanzia; organizzazioni di volontariato; gruppi di anziani; associazioni ricreative e culturali; altre organizzazioni comunitarie; membri della comunità."}]}, {"n": 11, "area": "Area 3 - Sviluppo professionale", "tabTitle": "Impegnarsi nel proprio sviluppo professionale e nella professione", "tabDesc": "Analizzare, valutare e sviluppare continuamente tutti gli aspetti della propria pratica professionale e promuovere lo status e il riconoscimento della professione docente, favorendo una cultura professionale condivisa basata sul sostegno reciproco e sulla cooperazione.", "title": "Impegnarsi nel proprio sviluppo professionale e a favore della professione", "sub": "Analizzare, valutare e sviluppare continuamente tutti gli aspetti della propria pratica professionale e promuovere lo status e il riconoscimento della professione docente, favorendo una cultura professionale condivisa basata sul sostegno reciproco e sulla cooperazione.", "ob": ["Le scuole e la società fanno affidamento sugli insegnanti per garantire la qualità dell’istruzione e il successo dei giovani. Di conseguenza, spetta agli insegnanti investire nel proprio sviluppo professionale durante tutta la carriera, al fine di aggiornare, arricchire e ampliare le proprie conoscenze, competenze ed esperienze professionali per garantire il successo educativo degli studenti. Una professione come quella dell’insegnamento non può esistere senza il forte impegno di tutti gli insegnanti nei confronti della professionalità e dell’istruzione. È proprio questa partecipazione alla vita professionale che conferisce alla professione una vera vita pubblica e collettiva."], "de": ["La necessità di formazione continua e sviluppo professionale per gli insegnanti deriva direttamente dall’evoluzione dell’insegnamento e della società: «… il mondo sta cambiando e le scuole e gli insegnanti devono adattarsi costantemente. La formazione iniziale degli insegnanti non può prepararli a tutte le situazioni che dovranno affrontare nella loro vita professionale, motivo per cui dovranno impegnarsi nello sviluppo professionale per tutta la durata della loro carriera» (Conseil supérieur de l’éducation 2014, [Traduzione]). Questa visione della formazione e dello sviluppo degli insegnanti riconosce che l’insegnamento è un’attività dinamica e in continua evoluzione, suscettibile di miglioramento. Presuppone inoltre che alcune competenze possano essere sviluppate solo attraverso l’esperienza didattica acquisita nel corso della carriera.", "Lo sviluppo professionale degli insegnanti è sostenuto dall’opportunità di una formazione continua che soddisfi i più elevati standard di qualità, in linea con gli obiettivi del progetto educativo della scuola. Anche le amministrazioni scolastiche, gli organismi educativi, i sindacati, le università e il Ministère sono responsabili della formazione continua degli insegnanti, creando le condizioni necessarie affinché questi possano parteciparvi.", "Gli insegnanti dimostrano di essere attivi nella vita professionale^9^ partecipando alle varie attività collettive legate all’insegnamento e a diverse forme di dibattito e ricerca. Per contribuire al miglioramento e alla validazione della ricerca educativa nelle scuole, gli insegnanti devono poter partecipare alla ricerca contemporanea sull’insegnamento e l’apprendimento in linea con le loro esigenze, prospettive ed esperienze.^10^ Contribuire alla professione è un impegno che si evolve di pari passo con il lavoro e la carriera dell’insegnante. Questo impegno si manifesta ogni volta che gli insegnanti si aiutano a vicenda per migliorare la qualità delle loro pratiche educative e quando gli insegnanti esperti forniscono sostegno a quelli alle prime armi (Gauthier et al. 2005; Martineau e Bergevin 2007)."], "el": ["Adotta un atteggiamento riflessivo rispetto alla propria pratica didattica al fine di migliorarla continuamente.", "Avvalendosi delle risorse appropriate, mette in atto gli strumenti necessari per sviluppare e aggiornare le proprie competenze professionali.", "A seconda delle esigenze degli studenti e delle proprie, partecipa ad attività di formazione continua quali quelle definite nella sezione 7 della Legge che modifica principalmente la Legge sull’istruzione per quanto riguarda l’organizzazione e la governance scolastica.", "Legge, analizza e valuta con occhio critico le pubblicazioni specializzate e ne discute il contenuto al fine di individuare elementi da integrare nella propria pratica didattica.", "Analizza le questioni educative e i dilemmi professionali al fine di arricchire la propria pratica e rafforzare il proprio ruolo di insegnante.", "Promuove le attività di ricerca e formazione all’interno della propria scuola.", "Sviluppa una cultura collaborativa con i colleghi e la comunità educativa al fine di promuovere il prestigio e il riconoscimento della professione docente.", "Partecipa alla promozione e alla diffusione di progetti ed esperienze che dimostrino i risultati e l’impegno degli insegnanti e dei loro studenti.", "Sostiene e incoraggia i colleghi nel loro sviluppo professionale, in particolare coloro che si stanno preparando ad accedere alla professione (tirocinanti) e coloro che vi sono entrati da poco (insegnanti alle prime armi)."], "notes": []}, {"n": 12, "area": "Competenze trasversali", "tabTitle": "Sfruttare le tecnologie digitali", "tabDesc": "Utilizzare le tecnologie digitali a beneficio degli studenti e di tutti gli attori del mondo dell’istruzione.", "title": "Utilizzare le tecnologie digitali", "sub": "Utilizzare le tecnologie digitali a beneficio degli studenti e di tutti gli attori del mondo dell’istruzione.", "ob": ["La trasformazione delle scuole, che deriva in parte dal massiccio cambiamento tecnologico in atto nella società, richiede agli insegnanti di assumere un atteggiamento critico e consapevole riguardo all’uso degli strumenti digitali in classe. Ciò li aiuterà a scegliere gli strumenti più adatti ad ampliare e arricchire l’apprendimento. Gli insegnanti devono incoraggiare i propri studenti a utilizzare gli strumenti tecnologici in modo creativo e appropriato. Devono inoltre sensibilizzare i propri studenti sull’importanza di citare le fonti, sui concetti di riservatezza e consenso, nonché sulle ripercussioni dell’uso di questi strumenti sulle relazioni sociali e sul benessere psicologico e fisico."], "de": ["L’ambito di questa competenza va oltre le competenze tecniche necessarie per utilizzare gli strumenti digitali a fini didattici in classe. Gli insegnanti devono essere consapevoli dell’impatto di questi cambiamenti sulla natura e sul valore dell’apprendimento, tenendo conto non solo degli strumenti digitali che li supportano, ma anche del contesto culturale in cui vengono condivisi.", "In questo senso, l’uso delle tecnologie digitali è intessuto in tutte le nostre pratiche e produzioni culturali. Esso integra altre forme di intelligenza in una rete e, per estensione, altri modelli di conoscenza, altri modelli di accesso alla conoscenza e altri modelli educativi che influenzeranno sempre più l’apprendimento degli studenti e il loro rapporto con la conoscenza."], "el": ["Esercita una cittadinanza etica nell’era digitale.", "Sviluppa e mette in pratica le competenze tecnologiche.", "Sfrutta il potenziale delle risorse digitali per l’apprendimento.", "Sviluppa e mette in pratica l’alfabetizzazione informativa.", "Collabora attraverso la tecnologia digitale.", "Comunica attraverso la tecnologia digitale.", "Realizza contenuti utilizzando la tecnologia digitale.", "Utilizza strumenti digitali per promuovere l'inclusione e rispondere a esigenze diverse.", "Sfrutta la tecnologia digitale per favorire l'empowerment personale e professionale.", "Risolve problemi di vario genere tramite la tecnologia digitale.", "Sviluppa il pensiero critico riguardo all’uso della tecnologia digitale.", "Adotta un approccio innovativo e creativo all’uso della tecnologia digitale."], "notes": [{"n": "11", "t": "Gli elementi chiave sono tratti dal Quadro di riferimento delle competenze digitali (Ministère de l’Éducation et de l’Enseignement supérieur 2019)."}]}, {"n": 13, "area": "Competenze trasversali", "tabTitle": "Agire in conformità con i principi etici della professione", "tabDesc": "Adottare e promuovere comportamenti etici e responsabili al fine di instaurare relazioni improntate al rispetto e alla fiducia con gli studenti, i membri del personale scolastico e la più ampia comunità educativa.", "title": "Agire in conformità con i principi etici della professione", "sub": "Adottare e promuovere comportamenti etici e responsabili al fine di instaurare relazioni improntate al rispetto e alla fiducia con gli studenti, i membri del personale scolastico e la più ampia comunità educativa.", "ob": ["L’adozione e la promozione di comportamenti etici e responsabili gettano le basi per il rapporto di fiducia che gli insegnanti devono instaurare e mantenere con la società. Questo rapporto affonda le sue radici nei legami che gli insegnanti costruiscono ogni giorno con i propri studenti, i colleghi e gli altri membri della comunità, e attraverso i quali contribuiscono a creare un clima e un ambiente favorevoli al successo educativo."], "de": ["Per gli insegnanti, agire in modo etico significa dimostrare professionalità e capacità di giudizio in conformità con il quadro normativo della propria professione e della scuola (Fullan, Quinn e McEachen 2019). Implica inoltre la comprensione e l’adempimento delle proprie responsabilità professionali. Di conseguenza, in qualità di esperti specializzati nell’insegnamento e nell’apprendimento, gli insegnanti devono assumersi la responsabilità dei metodi che utilizzano per educare e socializzare gli studenti. Agire in modo etico richiede inoltre che gli insegnanti adottino atteggiamenti o valori che influenzino il modo in cui svolgono i propri compiti, in particolare attraverso le relazioni che instaurano con gli studenti e quelle che intrattengono con il pubblico in generale. Più in generale, per quanto riguarda le relazioni interpersonali, agire in modo etico significa adottare un atteggiamento di rispetto, inclusività e apertura nei confronti di studenti, colleghi, genitori e partner della comunità. L’inclusione^12^ deve essere vista come un atto di equità individuale e collettiva che fornisce una risposta tangibile alle realtà culturali e di altro tipo presenti nella scuola e nella società in generale (Rousseau 2010; Rousseau et al. 2015).", "Agire in modo etico significa anche che gli insegnanti devono essere in grado di giustificare le proprie decisioni e dimostrare la pertinenza dei propri interventi alla luce del contesto didattico e della natura diversificata della propria classe. Gli insegnanti adottano comportamenti equi, trasparenti e inclusivi che influenzano il modo in cui svolgono il proprio lavoro. Pertanto, nelle relazioni che instaurano con i propri studenti, gli insegnanti devono adottare un atteggiamento di sostegno, rimanendo al contempo convinti che tutti gli studenti possano raggiungere il successo scolastico. Gli insegnanti creano inoltre condizioni educative in cui gli studenti siano valorizzati, rispettati e compresi. Promuovono opportunità per imparare a convivere creando un clima che incoraggi relazioni sociali e interculturali rispettose e arricchenti."], "el": ["Agisce e si comporta in modo rispettoso nei confronti della scuola e di ciò che essa rappresenta.", "Incoraggia e valorizza le azioni e i comportamenti che riflettono i valori della scuola e della società del Québec.", "È consapevole delle questioni etiche legate alla pratica dell’insegnamento al fine di svolgere i propri compiti con integrità.", "Tiene conto del quadro giuridico applicabile nell’esercizio dei propri diritti e delle proprie responsabilità professionali.", "Agisce con attenzione e diligenza per tutelare la riservatezza delle informazioni relative alla vita privata degli studenti e degli altri soggetti coinvolti nel processo educativo.", "Rispetta i ruoli e le responsabilità delle persone coinvolte nella comunità educativa.", "Denuncia e smantella le conoscenze, le pratiche, gli atteggiamenti e i processi che generano o riproducono situazioni di esclusione e discriminazione nei contesti educativi.", "Evita ogni forma di discriminazione adottando pratiche e atteggiamenti equi, trasparenti e inclusivi nei confronti degli studenti, dei colleghi e della comunità."], "notes": []}], "fonte": "Fonte: Gouvernement du Québec, Ministère de l’Éducation, Quadro di riferimento delle competenze professionali - Professione docente, 2021. Testi delle competenze riprodotti dal framework fornito.", "IN": [{"h": "Insegnante professionista e Magister", "p": ["Troppo spesso si dimentica che un insegnante è magis (da cui magister) ʻdi piùʼ, e che può essere volano del desiderio di apprendere di un allievo. Come tale, egli può diventare un punto di riferimento essenziale del percorso di formazione dello studente. L’allievo, infatti, è animato dal desiderio di imparare e sceglie una guida che sappia stimolarlo in tale direzione. E la funzione di ʻguidaʼ assunta dal “magister” è fondamentale affinché il desiderio dell’allievo si orienti verso le esperienze e i contenuti del curricolo. L'espressione Magister vuole sottolineare l'autorevolezza ritrovata della figura del docente. È questo il presupposto essenziale per poter svolgere quella funzione di valorizzazione dei talenti di ogni giovane che è propria di una scuola che metta realmente al centro la persona dello studente.", "La dimensione educativa di una scuola è peraltro immediatamente riconoscibile dall’impegno che insegnanti, dirigenti e personale ATA – con spirito di collegialità – svolgono quotidianamente al servizio degli studenti nel capire stili e orientamenti delle famiglie valorizzando, attraverso il dialogo, esperienze di comprensione e di accoglienza. Cambiamenti fra generazioni hanno peraltro modificato la stessa idea di genitorialità. Restano però sempre uguali i bisogni che bambini e ragazzi rivolgono ai loro adulti di riferimento, genitori e insegnanti: bisogni di sicurezza, di essere amati, di formarsi un’immagine stabile e positiva di sé, di delineare la propria personalità, di vivere in un ambiente sereno, di imparare con gioia. Di qui l’impegno, per insegnanti e genitori, in una rinnovata alleanza educativa, di praticare l’esercizio quotidiano della valorizzazione reciproca."]}, {"h": "Un dispositivo per ‘pensare’ l’insegnamento", "p": ["Nel rispetto e nella valorizzazione dell’autonomia delle istituzioni scolastiche, le Indicazioni Nazionali per la scuola dell’infanzia e per il primo ciclo propongono un cambio di paradigma rimettendo al centro la valorizzazione delle conoscenze che sono la base fondamentale per lo sviluppo delle competenze identificate nel Profilo dello studente. Per questo le Indicazioni Nazionali reintegrano pienamente la dimensione delle conoscenze offrendosi come un chiaro quadro di riferimento per la progettazione del curricolo verticale delle scuole.", "Le scuole e, al loro interno, il lavoro collegiale dei docenti, sono chiamate a progettare, attuare, monitorare e valutare il curricolo come dispositivo per promuovere la maturazione delle competenze attese attraverso i saperi fondamentali indicati di seguito.", "La promozione degli apprendimenti richiede una professionalità insegnante solida e strutturata, fondata sulla collegialità, intesa come costruzione condivisa di senso e azione pedagogica, e sulla formazione continua, elemento imprescindibile per rispondere alla complessità dei contesti scolastici e sostenere l’innovazione didattica. La formazione docente è un processo continuo e integrato, che va oltre il solo approfondimento disciplinare per includere in modo sostanziale le competenze relazionali, didattiche e valutative, indispensabili per affrontare il lavoro di organizzazione del curricolo in modi che alimentino autonomia, desiderio di apprendere e creatività degli studenti.", "Ogni istituzione scolastica predispone il curricolo verticale di istituto all’interno del Piano Triennale dell’Offerta Formativa (PTOF) con riferimento al profilo dello studente al termine del primo ciclo di istruzione, agli obiettivi generali del processo formativo, agli obiettivi specifici di apprendimento e alle competenze attese, specificati per ogni disciplina. La logica di progettazione suggerita dalle Indicazioni è rispettosa delle autonomie delle scuole e dei raccordi possibili con i rispettivi territori."]}, {"h": "Non multa, sed multum", "p": ["Le Indicazioni Nazionali portano all’attenzione degli insegnanti il tema del curricolo verticale costruito anche grazie alla individuazione delle cosiddette ‘conoscenze essenziali’. Il principio da seguire nella costruzione del curricolo è, infatti, quello del non multa, sed multum. Non occorre insegnare tante cose (di italiano, di arte, di musica, di matematica, di tecnologia ecc.) non sempre comprese dagli studenti, ma poche ed essenziali conoscenze, approfondite in aula con grande accuratezza e dovizia di esperienze di apprendimento. Dilatare a dismisura la quantità di conoscenze da insegnare diluisce, infatti, la sostanza di quanto i discenti possono apprendere: occorre dunque scegliere conoscenze rilevanti (sul piano culturale), significative (sul piano scientifico), essenziali (sul piano formativo). Nelle Indicazioni le discipline – ad eccezione di quelle scientifiche e tecnologiche, introdotte da una premessa che ne mette in luce i punti di aggregazione, ferme restando l’identità e le specificità, anche dal punto di vista didattico, di ognuna di esse – non sono aggregate in aree precostituite ma sono presentate singolarmente seguendo una struttura precisa, ad alta leggibilità (cfr. schema n. 1) e rispecchiante l’originalità delle didattiche delle diverse discipline: perché si studia la disciplina; obiettivi specifici di apprendimento e competenze attese coerenti rispetto alle competenze chiave D.M. 14/2024; conoscenze. Ogni disciplina presenta nuclei fondanti (concetti ritenuti fondamentali) verticalizzati nei gradi per agevolare il lavoro di progettazione curricolare.", "Il dispositivo del curricolo risponde a quattro domande-guida: quali obiettivi conseguire? Quali esperienze allestire per far sì che gli obiettivi di apprendimento vengano conseguiti? Come possono essere organizzate efficacemente quelle esperienze? Come accertare che gli obiettivi siano stati raggiunti? Secondo questa prospettiva insegnanti e dirigenti scolastici sono i ‘costruttori’ e i ‘realizzatori’ di un ‘curricolo reale, vissuto’, frutto del necessario connubio - in virtù delle proprie conoscenze pratiche personali - fra quanto suggerito nelle Indicazioni nazionali in termini di conoscenze, abilità e competenze, e quanto chiesto dalla comunità e dai contesti, e in vista del curricolo di istituto (frutto delle scelte della scuola che calibra la sua offerta a seconda dei contesti) allo scopo di soddisfare, in primis, i bisogni formativi e apprenditivi dei discenti. Pur nella consapevolezza della prescrittività delle Indicazioni Nazionali quanto alla definizione delle competenze attese, degli obiettivi generali del processo formativo e degli obiettivi specifici di apprendimento – fondamentali per la verifica periodica e finale e per lo svolgimento degli esami di Stato (cfr. D.M. n. 741 del 3 ottobre 2017) – il curricolo delle scuole, nel rispetto dell’autonomia delle istituzioni scolastiche, è un lavoro pratico, altamente decisionale, espressione del lavoro vivo degli insegnanti e dell’impegno di scuole che sono comunità educanti e professionali insieme."]}, {"h": "La valutazione. Un atto di valorizzazione", "p": ["La valutazione nella scuola del primo ciclo si configura come un processo educativo di grande rilevanza: complesso, dinamico, collegiale e multidimensionale, che accompagna lo studente nella costruzione della propria identità e nel riconoscimento delle proprie potenzialità. Come richiamato dall’art. 1 del D.Lgs. n. 62 del 13 aprile 2017, la valutazione documenta lo sviluppo dell’identità personale degli studenti e promuove l’autovalutazione in relazione alle acquisizioni di conoscenze e competenze. In quanto atto pedagogico, culturale e regolativo che pone al centro la valorizzazione e il riconoscimento della unicità degli allievi, essa non si esaurisce nel rilevare e misurare ciò che essi sanno o sanno fare, ma diviene strumento che mira a far emergere progressi, criticità e potenzialità inespresse. In questo contesto, è fondamentale comprendere la funzione essenziale della valutazione per l'apprendimento, superando la percezione che sia un'attività inutile o fonte di ansia. Le evidenze raccolte dalla ricerca hanno ormai dimostrato come tra i fattori più importanti per migliorare gli apprendimenti vi siano il feedback e la valutazione formativa: quest’ultima costituisce un processo continuo e integrato nell'insegnamento che monitora l'apprendimento in itinere per fornire supporto e orientamento. Essa si distingue dalla valutazione sommativa, che interviene al termine di periodi specifici per tracciare un bilancio complessivo delle competenze acquisite. La valutazione è, oltremodo, formativa anche per il docente in quanto importante fonte di regolazione della propria didattica e di feedback sul proprio operato.", "La valutazione non è, dunque, un fine, ma rappresenta uno strumento di orientamento, capace di promuovere il successo formativo di ciascuno studente e una relazione educativa significativa con i saperi. Nelle sue diverse articolazioni – diagnostica, iniziale, formativa in itinere, autovalutativa, metacognitiva, finale – la valutazione permette di cogliere il percorso di apprendimento nel suo farsi, valorizzando la dimensione processuale e dinamica dell’apprendimento, e di restituire agli alunni e alle famiglie una visione chiara del cammino intrapreso: cammino che non si limita alla padronanza di saperi disciplinari, ma che abbraccia anche competenze trasversali e la consapevolezza metacognitiva dei propri punti di forza e delle proprie aree di miglioramento.", "Il rischio da scongiurare, sempre presente, è infatti quello di cadere in una logica sommativa e selettiva, in cui i saperi disciplinari vengono valutati in modo frammentario, senza integrarsi in un percorso unitario e trasformativo. Occorre invece adottare modalità valutative che sappiano cogliere la complessità e la profondità del processo formativo di ogni studente. In questo senso, è importante soffermarsi su come i concetti di competenza, di obiettivi generali del processo formativo e di obiettivi specifici di apprendimento (OSA) possano concretamente diventare oggetto di valutazione. Il termine competenza viene impiegato, in un’accezione ormai diffusa, per indicare capacità di ordine generale del soggetto nel saper impiegare conoscenze, abilità, atteggiamenti per affrontare problemi significativi sia nell’ambito disciplinare che nella vita reale. Gli obiettivi specifici di apprendimento (OSA) indicano risultati auspicati più circoscritti che debbono essere oggetto di una valutazione attuata dalle scuole, sia a livello di valutazione formativa che sommativa. Per rendere valutabili gli obiettivi, è necessario che siano resi operativi, tradotti in prove concrete con criteri attesi chiari. È cruciale considerare i diversi tipi di conoscenza coinvolti, distinguendo tra conoscenze di superficie (fattuali, dichiarative) e conoscenze profonde (applicazioni, integrazioni, riflessioni critiche). In questo contesto, le tecnologie possono rappresentare un valido supporto nella creazione e gestione di prove di valutazione affidabili, offrendo strumenti per la progettazione di item efficaci, la somministrazione e l'analisi dei risultati, pur richiedendo sempre una revisione da parte di docenti esperti. Il tutto senza appesantire inutilmente il lavoro degli insegnanti con pratiche burocratiche eccessive, ma attraverso la semplificazione dei processi (in primis nella comunicazione con le famiglie) e il rispetto dell’autonomia progettuale e creativa delle scuole, ovvero della capacità di adattarsi a contesti specifici e alle esigenze sempre più eterogenee degli studenti.", "La documentazione e l'osservazione costituiscono due prerequisiti fondamentali per una valutazione efficace e per la comprensione e il monitoraggio dei processi di apprendimento, in quanto consentono di raccogliere, organizzare e interpretare dati, sulla base di specifici indicatori. Gli indicatori della valutazione, opportunamente selezionati, consentono di trasformare concetti teorici in elementi operativi, osservabili, rendendo ‘leggibile’ il percorso di apprendimento. L’osservazione, accompagnata da strumenti adeguati (ad es. rubriche, griglie di osservazione, scale, ecc.), favorisce la costruzione di criteri intersoggettivi per la formulazione di giudizi valutativi e può supportare un processo trasparente e condiviso con studenti e famiglie. In questa prospettiva, la valutazione non può essere considerata un atto individuale, ma il risultato di un processo collegiale, in cui il confronto tra docenti consente di definire criteri comuni e condivisi, assicurando equità e coerenza nel processo di presa di decisione. La documentazione e il lavoro collegiale dei docenti su indicatori, criteri e strumenti della valutazione diventano, quindi, un supporto essenziale per una cultura valutativa basata sulla corresponsabilità.", "In questa dinamica, gli insegnanti, veri curriculum makers, sono chiamati a elaborare percorsi didattici e valutativi che non solo rispondano al curricolo di Istituto e alle Indicazioni Nazionali e concorrano alla definizione del profilo educativo in uscita, ma rispettino anche le peculiarità dei contesti locali e le peculiarità delle studentesse e degli studenti."]}, {"h": "La professionalità dell’insegnante di scuola dell’infanzia", "p": ["Il profilo professionale dell’insegnante di scuola dell’infanzia richiede il possesso di una solida conoscenza psicopedagogica e metodologico-didattica, senza trascurare una solida preparazione disciplinare sia nel campo delle discipline umanistiche sia nel campo delle discipline scientifiche e tecnologiche, insieme ad una forte motivazione nell’assumere un ruolo di guida educativa nei confronti dei bambini, costruendo relazioni positive con loro e con le famiglie, nel rispetto della singolarità di ciascuno e in stretta collaborazione con gli altri insegnanti e, ove possibile, con il personale dei servizi educativi per l’infanzia, grazie ad una forma di coordinamento pedagogico territoriale. A questo risultato concorrono la consapevolezza del continuo perfezionamento delle proprie competenze professionali all’interno di contesti educativi reali in cui praticare una riflessività ricorsiva sulle pratiche, anche al fine di imparare a sostenere e a orientare meglio i bambini alla scoperta delle attitudini, delle potenzialità e dei talenti personali.", "Come affermato dalle Linee pedagogiche per il sistema integrato “zerosei”, le dimensioni della professionalità dell’insegnante di scuola dell’infanzia, al pari di quelle dell’educatore per i servizi educativi per l’infanzia, sono riconducibili alle posture di un adulto accogliente, in ascolto, incoraggiante, responsabile, partecipe e “regista” di una didattica finalizzata all’educazione indiretta. Tale profilo si caratterizza per il possesso di competenze educative, disciplinari, psicopedagogiche, metodologico-didattiche, organizzativo-relazionali, di osservazione, di valutazione formativa e di contesto, di documentazione, ma anche di innovazione e di ricerca di nuove strategie educative e didattiche, nel rispetto dei ritmi di sviluppo di ciascun bambino.", "Animati da una visione della scuola dell’infanzia come laboratorio in cui ogni bambino sperimenta, attraverso la mente, il cuore e le mani, il proprio “darsi forma” e la genesi di un pensiero personale, gli insegnanti agiscono sul piano educativo e della mediazione didattica in continuità con quanto delineato dagli Orientamenti nazionali per i servizi educativi per l’infanzia. Sanno gestire attività educative e didattiche a piccolo o a grande gruppo (in sezioni omogenee o eterogenee per età, ma anche in attività di intersezione), predisponendo ambienti su misura dei bisogni formativi dei più piccoli, in termini di spazi, tempi, strutture, arredi, materiali e tecnologie, secondo quanto suggerito dalle Linee pedagogiche per il sistema integrato “zerosei” in termini di cura educativa, accessibilità, varietà di esperienze possibili e qualità culturali delle stesse.", "Nel perseguire tali obiettivi, gli insegnanti sono consapevoli dello stretto legame esistente, in ogni loro azione, fra cura, educazione, formazione e istruzione, con l’obiettivo di garantire il benessere dei bambini e di creare un legame di fiducia e di partnership educativa con le famiglie, con le formazioni sociali presenti a livello locale, con i servizi educativi per l’infanzia nell’ambito del Coordinamento pedagogico territoriale e il primo ciclo di istruzione."]}], "CC": [{"h": "Art. 40 - Funzione docente", "p": ["1.La funzione docente realizza – nel rispetto della Costituzione Italiana - il processo di insegnamento/apprendimento volto a promuovere lo sviluppo umano, culturale, civile e professionale degli alunni, sulla base delle finalità e degli obiettivi previsti dagli ordinamenti scolastici definiti per i vari ordini e gradi dell'istruzione.", "2.La funzione docente si fonda sull’autonomia culturale e professionale dei docenti; essa si esplica nelle attività individuali e collegiali e nella partecipazione alle attività di aggiornamento e formazione in servizio.", "3.In attuazione dell’autonomia scolastica i docenti, nelle attività collegiali, attraverso processi di confronto ritenuti più utili e idonei, elaborano, attuano e verificano, per gli aspetti pedagogico – didattici, il piano triennale dell’offerta formativa, adattandone l’articolazione alle differenziate esigenze degli alunni e tenendo conto del contesto socio - economico di riferimento, anche al fine del raggiungimento di condivisi obiettivi qualitativi di apprendimento in ciascuna classe e nelle diverse discipline. Dei relativi risultati saranno informate le famiglie con le modalità decise dal collegio dei docenti.", "4.Il presente articolo abroga l’art. 26 del CCNL 29/11/2007."]}, {"h": "Art. 42 - Profilo professionale docente", "p": ["1.Il profilo professionale dei docenti è costituito da competenze disciplinari, informatiche, linguistiche, psicopedagogiche, metodologico-didattiche, organizzativo-relazionali, di orientamento e di ricerca, documentazione e valutazione tra loro correlate ed interagenti, che si sviluppano col maturare dell’esperienza didattica, l’attività di studio e di sistematizzazione della pratica didattica. I contenuti della prestazione professionale del personale docente si definiscono nel quadro degli obiettivi generali perseguiti dal sistema nazionale di istruzione e nel rispetto degli indirizzi delineati nel piano dell’offerta formativa della scuola.", "2.Il presente articolo abroga l’articolo 27 del CCNL 19/04/2018 e l’art. 27 del CCNL 29/11/2007."]}, {"h": "Art. 44 - Attività funzionali all’insegnamento", "p": ["1.L’attività funzionale all’insegnamento è costituita da ogni impegno inerente alla funzione docente previsto dai diversi ordinamenti scolastici. Essa comprende tutte le attività, anche a carattere collegiale, di programmazione, progettazione, ricerca, valutazione, documentazione, aggiornamento e formazione, compresa la preparazione dei lavori degli organi collegiali, la partecipazione alle riunioni e l’attuazione delle delibere adottate dai predetti organi.", "2.Tra gli adempimenti individuali dovuti rientrano le attività relative:", "a) alla preparazione delle lezioni e delle esercitazioni;", "b) alla correzione degli elaborati;", "c) ai rapporti individuali con le famiglie.", "3.Le attività di carattere collegiale riguardanti tutti i docenti sono costituite da:", "a) partecipazione alle riunioni del Collegio dei docenti, ivi compresa l'attività di programmazione e verifica di inizio e fine anno e l'informazione alle famiglie sui risultati degli scrutini trimestrali, quadrimestrali e finali e sull'andamento delle attività educative nelle scuole dell’infanzia e nelle istituzioni educative, fino a 40 ore annue;"]}], "TAB": [{"n": 1, "area": "Competenze fondamentali", "title": "Agire da facilitatore culturale nello svolgimento delle proprie mansioni", "desc": "Agire come professionista colto che sia al tempo stesso interprete, facilitatore e critico della cultura nell’esercizio delle proprie funzioni."}, {"n": 2, "area": "Competenze fondamentali", "title": "Padroneggiare la lingua di insegnamento", "desc": "Comunicare in modo appropriato nella lingua di insegnamento, sia oralmente che per iscritto, in tutti i contesti legati allo svolgimento delle proprie mansioni."}, {"n": 3, "area": "Area 1 - Lavorare con e per gli studenti", "title": "Pianificare situazioni didattiche e di apprendimento", "desc": "Progettare e pianificare attività e situazioni didattiche e di apprendimento adeguate agli studenti, ai contenuti didattici e agli obiettivi formativi."}, {"n": 4, "area": "Area 1 - Lavorare con e per gli studenti", "title": "Attuare situazioni didattiche e di apprendimento", "desc": "Attuare e supervisionare situazioni didattiche adeguate agli studenti e agli obiettivi formativi."}, {"n": 5, "area": "Area 1 - Lavorare con e per gli studenti", "title": "Valutare l’apprendimento", "desc": "Sviluppare, scegliere e utilizzare diversi metodi per valutare l’acquisizione delle conoscenze e lo sviluppo delle competenze."}, {"n": 6, "area": "Area 1 - Lavorare con e per gli studenti", "title": "Gestire il funzionamento della classe", "desc": "Organizzare e gestire una classe in modo da massimizzare lo sviluppo, l’apprendimento e la socializzazione degli studenti."}, {"n": 7, "area": "Area 1 - Lavorare con e per gli studenti", "title": "Tenere conto della diversità degli studenti", "desc": "Attuare, nell’ambito di un approccio didattico inclusivo, strategie volte a differenziare le pratiche didattiche in modo da favorire la piena partecipazione e il successo di tutti gli studenti."}, {"n": 8, "area": "Area 1 - Lavorare con e per gli studenti", "title": "Sostenere la passione degli studenti per l’apprendimento", "desc": "Coltivare il naturale desiderio di apprendere degli studenti, il loro senso di scoperta e la loro curiosità creando le condizioni necessarie per aiutare tutti gli studenti a realizzarsi."}, {"n": 9, "area": "Area 2 - Professionalità collaborativa", "title": "Essere attivamente coinvolti come membri del team scolastico", "desc": "Inserire le proprie attività in un contesto collettivo, al servizio della complementarità e della continuità delle attività didattiche intese come atti educativi."}, {"n": 10, "area": "Area 2 - Professionalità collaborativa", "title": "Collaborare con la famiglia e i partner educativi della comunità", "desc": "Promuovere e incoraggiare il coinvolgimento dei genitori nell’apprendimento e nella vita scolastica dei propri figli, e contribuisce a instaurare collaborazioni durature tra la scuola e la comunità."}, {"n": 11, "area": "Area 3 - Sviluppo professionale", "title": "Impegnarsi nel proprio sviluppo professionale e nella professione", "desc": "Analizzare, valutare e sviluppare continuamente tutti gli aspetti della propria pratica professionale e promuovere lo status e il riconoscimento della professione docente, favorendo una cultura professionale condivisa basata sul sostegno reciproco e sulla cooperazione."}, {"n": 12, "area": "Competenze trasversali", "title": "Sfruttare le tecnologie digitali", "desc": "Utilizzare le tecnologie digitali a beneficio degli studenti e di tutti gli attori del mondo dell’istruzione."}, {"n": 13, "area": "Competenze trasversali", "title": "Agire in conformità con i principi etici della professione", "desc": "Adottare e promuovere comportamenti etici e responsabili al fine di instaurare relazioni improntate al rispetto e alla fiducia con gli studenti, i membri del personale scolastico e la più ampia comunità educativa."}], "intro": "Quadro sinottico per lo studio. Le formulazioni delle competenze e le descrizioni essenziali sono tratte dal framework del Québec.", "titoloQC": "Le 13 competenze professionali degli insegnanti", "titoloIN": "Dalle Indicazioni Nazionali 2025", "titoloCC": "Estratto dal CCNL vigente"};

const API = "https://confronto-competenze.unamanospensierata.workers.dev";
const ONL = { base:null, volo:false, ancora:false, t:0, ora:"", errore:false };
const DATI_K = ["meta", "members", "c", "sint", "chk", "timbri"];
const datiDi = () => JSON.parse(JSON.stringify(Object.fromEntries(DATI_K.map(k => [k, S[k]]))));
function piatto(d){
  const o = {}, metti = (p, v) => o[p.join(".")] = [p, v];
  Object.entries(d.meta || {}).forEach(([k, v]) => metti(["meta", k], v));
  metti(["members"], d.members || []);
  Object.entries(d.c || {}).forEach(([n, x]) => Object.entries(x || {}).forEach(([k, v]) => metti(["c", n, k], v)));
  ["sint", "chk", "timbri"].forEach(g => Object.entries(d[g] || {}).forEach(([k, v]) => metti([g, k], v)));
  return o;
}
function applicaDati(d){
  const v = vuoto();
  S.meta = Object.assign(v.meta, d.meta || {});
  S.members = Array.isArray(d.members) ? d.members : [];
  S.c = v.c; Object.entries(d.c || {}).forEach(([n, x]) => { if (S.c[n]) Object.assign(S.c[n], x); if (!Array.isArray(S.c[n]?.arts)) S.c[n].arts = []; });
  S.sint = Object.assign(v.sint, d.sint || {}); S.chk = Object.assign(v.chk, d.chk || {}); S.timbri = Object.assign({}, d.timbri || {});
}
async function chiama(azione, corpo){
  const r = await fetch(`${API}/${azione}`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(corpo) });
  let j = {}; try { j = await r.json(); } catch(e){}
  return { stato:r.status, ...j };
}
const uguale = (a, b) => JSON.stringify(a) === JSON.stringify(b);
async function sync(){
  if (!S.online) return;
  if (ONL.volo){ ONL.ancora = true; return; }
  ONL.volo = true;
  const prima = piatto(datiDi()), base = ONL.base || {};
  const modifiche = Object.entries(prima).filter(([k, [, v]]) => !base[k] || !uguale(base[k][1], v)).map(([, x]) => x);
  try {
    const r = await chiama("salva", { ...S.online, modifiche });
    if (r.stato === 401 || r.stato === 404){ ONL.errore = true; mostraSalv(); return; }
    if (!r.ok) throw new Error(r.errore || "rete");
    const dopo = piatto(datiDi());
    applicaDati(r.dati);
    ONL.base = piatto(datiDi()); salvaBase();
    Object.entries(dopo).forEach(([k, [p, v]]) => { if (!prima[k] || !uguale(prima[k][1], v)){ let o = S; p.slice(0, -1).forEach(x => o = o[x]); o[p[p.length - 1]] = v; } });
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    ONL.ora = new Date().toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" }); ONL.errore = false;
    rinfresca();
  } catch(e){ ONL.errore = true; }
  finally {
    ONL.volo = false; mostraSalv();
    if (ONL.ancora){ ONL.ancora = false; programma(800); }
  }
}
function salvaBase(){ try { localStorage.setItem(KEY + "_base", JSON.stringify(ONL.base)); } catch(e){} }
function programma(ms = 1200){ if (!S.online) return; clearTimeout(ONL.t); ONL.t = setTimeout(sync, ms); }
setInterval(() => { if (S.online && document.visibilityState === "visible" && !$(".velo")) sync(); }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") programma(200); });

async function creaGruppo(){
  const pw = ($("#f-pass")?.value || "").trim();
  if (!S.meta.gruppo.trim() || !S.meta.tutor.trim()) return errore("Mancano il nome del gruppo o il tutor: tornate indietro e scriveteli.");
  if (pw.length < 4) return errore("La password deve avere almeno 4 caratteri.");
  const b = $("#b-av"); b.disabled = true; errore("");
  try {
    const r = await chiama("crea", { gruppo:S.meta.gruppo, tutor:S.meta.tutor, password:pw, dati:datiDi() });
    if (r.stato === 409) return errore("Esiste già un gruppo con questo nome e questo tutor. Se è il vostro, tornate all’inizio e scegliete «Entra nel gruppo».");
    if (!r.ok) throw new Error();
    S.online = { gruppo:S.meta.gruppo, tutor:S.meta.tutor, password:pw };
    ONL.base = piatto(datiDi()); salvaBase(); ONL.ora = new Date().toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" }); ONL.errore = false;
    salva(); coriandoli(); vai(idx("consegna"));
  } catch(e){ errore(RETE); }
  finally { b.disabled = false; }
}
async function entraGruppo(){
  const f = $("#f-entra"), g = f.gruppo.value.trim(), t = f.tutor.value.trim(), pw = f.password.value.trim();
  if (!g || !t || !pw) return errore("Scrivete nome del gruppo, tutor e password.");
  const b = $("#b-entra"); b.disabled = true; errore("");
  try {
    const r = await chiama("entra", { gruppo:g, tutor:t, password:pw });
    if (r.stato === 404) return errore("Non trovo un gruppo con questo nome e questo tutor. Controllate come li avete scritti.");
    if (r.stato === 401) return errore("La password non è corretta.");
    if (!r.ok) throw new Error();
    applicaDati(r.dati);
    S.online = { gruppo:g, tutor:t, password:pw };
    ONL.base = piatto(datiDi()); salvaBase(); ONL.ora = new Date().toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" }); ONL.errore = false;
    salva(); vai(idx("consegna"));
  } catch(e){ errore(RETE); }
  finally { b.disabled = false; }
}

/* ---------- impaginazione a colonne: niente scorrimento ---------- */
const GAP = 60;
function misura(){
  const pg = $("#pagine"), fl = $("#flusso");
  const w = fl.clientWidth;
  fl.style.columnWidth = w + "px"; fl.style.columnGap = GAP + "px";
  return w;
}
function impagina(p = pag){
  const fl = $("#flusso"); if ($("#pagine").hidden) return;
  const w = misura();
  fl.style.transition = "none"; fl.style.transform = "translateX(0)";
  // numero di pagine dalla posizione dell'ultimo elemento
  const kids = fl.lastElementChild ? fl.querySelectorAll("*") : [];
  let max = 0; const base = fl.getBoundingClientRect().left;
  kids.forEach(k => { const r = k.getBoundingClientRect(); if (r.width) max = Math.max(max, r.right - base); });
  nPag = Math.max(1, Math.ceil((max - 2) / (w + GAP)));
  void fl.offsetWidth; fl.style.transition = "";
  vaiPag(Math.min(p, nPag - 1), true);
}

function introVia(din, card){
  if (!card.isConnected) return;
  const box = $("#d-corpo").getBoundingClientRect(), r = card.getBoundingClientRect();
  const h1 = $("h1", card); h1.innerHTML = parole(h1.textContent);
  card.style.opacity = "";

  const dx = box.left + box.width / 2 - (r.left + r.width / 2), dy = box.top + box.height / 2 - (r.top + r.height / 2);
  card.style.transform = `translate(${dx}px, ${dy}px) scale(${sc})`;
  let fatto = false;
  const via = () => {
    if (fatto) return; fatto = true;
    card.classList.add("vola-giu"); card.style.transform = "";
    setTimeout(() => { din.classList.remove("intro-on"); $$(".dopo > *", din).forEach((el, i) => el.style.transitionDelay = (i * 90) + "ms"); }, 520);
    setTimeout(() => $("#d-piede").classList.remove("attesa"), 750);

  };

}
