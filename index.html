function sfogliabile(fl, frSx, frDx, info){
  const GAPX = 40; let i = 0, n = 1, w = 0;
  const misura = () => {
    w = fl.clientWidth; fl.style.columnWidth = w + "px"; fl.style.columnGap = GAPX + "px"; fl.style.transition = "none"; fl.style.transform = "none";
    let max = 0; const base = fl.getBoundingClientRect().left;
    $$("p,h3,h4,li,div.blocco", fl).forEach(p => { for (const r of p.getClientRects()) max = Math.max(max, r.right - base); });
    n = Math.max(1, Math.ceil((max - 2) / (w + GAPX)));
    void fl.offsetWidth; fl.style.transition = "";
    vai(Math.min(i, n - 1));
  };
  const vai = k => { i = Math.max(0, Math.min(n - 1, k)); fl.style.transform = `translateX(${-i * (w + GAPX)}px)`; frSx.disabled = i === 0; frDx.disabled = i >= n - 1; info.textContent = n > 1 ? `Pagina ${i + 1} di ${n}` : ""; frSx.style.visibility = frDx.style.visibility = n > 1 ? "" : "hidden"; };
  frSx.onclick = () => vai(i - 1); frDx.onclick = () => vai(i + 1);
  return { misura, vai };
}

function velo(html, centro = false){
  const v = document.createElement("div");
  v.className = "velo"; if (centro) v.style.justifyContent = "center";
  v.innerHTML = html;
  const chiudi = () => { v.remove(); document.removeEventListener("keydown", esci, true); };
  const esci = e => { if (e.key === "Escape"){ e.stopPropagation(); chiudi(); } };
  v.onclick = e => { if (e.target === v) chiudi(); };
  document.addEventListener("keydown", esci, true);
  document.body.appendChild(v);
  $$("[data-chiudi]", v).forEach(b => b.onclick = chiudi);
  return { v, chiudi };
}

function guida(){
  if ($(".guida-velo")) return;
  S.guida = true; salva();
  const p = passoAtt();
  if (!p.c && p.t !== "sint"){
    const i = PASSI.findIndex(x => x.t === "in-corr" && x.c.n === Math.max(1, (PASSI[S.ripresa || 0] || {}).c?.n || 1));

  let i = 0;
  const fine = () => { v.remove(); deseleziona(); if (telefono()) mostraTesti(false); document.removeEventListener("keydown", tasti, true); };
  const tasti = e => { if (e.key === "Escape"){ e.stopPropagation(); fine(); } };
  document.addEventListener("keydown", tasti, true);
  const vai_ = d => { i += d; if (i >= passi.length) return fine(); if (i < 0) i = 0; mostra(d); };
  const mostra = (d = 1) => {
    const g = passi[i];
    if (g.testi) mostraTesti(true); else if (telefono()) mostraTesti(false);

      const el = $(g.sel);
      if (!el || !el.getBoundingClientRect().width){ return vai_(d || 1); }

      Object.assign(buco.style, { left:(r.left - pad) + "px", top:(r.top - pad) + "px", width:(r.width + pad * 2) + "px", height:(r.height + pad * 2) + "px" });
      const tel = telefono();
      card.innerHTML = `<span class="n">${i + 1} / ${passi.length}</span><h3>${esc(tel && g.tp ? g.tp : g.t)}</h3><p>${esc(tel && g.tpp ? g.tpp : g.p)}</p>
        <div class="az"><button class="salta" id="g-salta">Salta</button>${i ? `<button class="tondo" id="g-ind" aria-label="Indietro">${ico("sx")}</button>` : ""}<button class="btn" id="g-av">${i === passi.length - 1 ? `${ico("ok")}<span>Fine</span>` : `<span>Avanti</span>${ico("avanti")}`}</button></div>`;
      card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
      const cw = card.offsetWidth, ch = card.offsetHeight, W = innerWidth, H = innerHeight, m = 14;
      let x, y;
      if (r.right + 24 + cw < W - m) { x = r.right + 24; y = r.top; }
      else if (r.left - 24 - cw > m) { x = r.left - 24 - cw; y = r.top; }
      else if (r.bottom + 20 + ch < H - m) { x = r.left; y = r.bottom + 20; }
      else { x = r.left; y = r.top - 20 - ch; }

      card.style.left = x + "px"; card.style.top = y + "px";

      $("#g-av", card).onclick = () => vai_(1);
      $("#g-ind", card) && ($("#g-ind", card).onclick = () => vai_(-1));

}

/* =========================================================================
   Coriandoli
   ========================================================================= */
function coriandoli(){
  if (ridotto) return;
  const cv = $("#coriandoli"), x = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const col = ["#6f6ad8", "#46a9bb", "#55a872", "#e9a52f", "#d9566a", "#3046b8"];
  const pezzi = Array.from({ length:130 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .36,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, c: col[(Math.random() * col.length) | 0], tondo: Math.random() < .35
  }));
  const t0 = performance.now();
  (function frame(t){
    const dt = Math.min(2, (t - (frame.ult || t)) / 16.7); frame.ult = t;
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of pezzi){
      p.vy += .36 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.tondo){ x.beginPath(); x.arc(0, 0, p.h * .8, 0, 7); x.fill(); } else x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore();
    }
    if (t - t0 < 2600) requestAnimationFrame(frame); else x.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

const COL = { fund:[112,87,166], a1:[39,121,143], a2:[61,124,99], a3:[165,111,36], tr:[173,78,88] };
function costruisciPDF(){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({ unit:"mm", format:"a4" });
  d.addFileToVFS("Figtree-R.ttf", FONT_R); d.addFont("Figtree-R.ttf", "Figtree", "normal");
  d.addFileToVFS("Figtree-B.ttf", FONT_B); d.addFont("Figtree-B.ttf", "Figtree", "bold");
  const W = 210, MX = 14, LW = W - MX * 2, BOT = 283;
  let y = 16;
  const pagina = need => { if (y + need > BOT){ d.addPage(); y = 16; } };
  const testo = (t, { size = 10, style = "normal", color = [31,41,55], w = LW, x = MX, lh = 1.38, gap = 2 } = {}) => {
    d.setFont("Figtree", style); d.setFontSize(size); d.setTextColor(...color);
    const righe = d.splitTextToSize(String(t || ""), w);
    const h = size * .3528 * lh;
    righe.forEach(r => { pagina(h); d.text(r, x, y + h * .78); y += h; });
    y += gap;
  };
  const campo = (etich, valore) => {
    if (etich) testo(etich, { size:9, style:"bold", color:[95,107,122], gap:1 });
    testo(valore || " ", { size:10, gap:1 });
    pagina(4); d.setDrawColor(203,213,223); d.setLineWidth(.2); d.line(MX, y, MX + LW, y); y += 4;
  };
  d.setFillColor(22,63,80); d.roundedRect(MX, y, LW, 26, 3, 3, "F");
  d.setFont("Figtree", "bold"); d.setFontSize(16); d.setTextColor(255,255,255);
  const tr = d.splitTextToSize(M.titolo, LW - 12); d.text(tr, MX + 6, y + 9);
  d.setFont("Figtree", "normal"); d.setFontSize(10); d.setTextColor(234,244,247);
  d.text(M.sottotitolo, MX + 6, y + 9 + tr.length * 6.2);
  y += 32;
  testo(M.consegnaH, { size:13, style:"bold", color:[23,63,79] });
  testo(M.consegna.join(""), { size:10 });
  campo(M.gruppo, S.meta.gruppo); campo(M.corso, S.meta.corso); campo(M.tutor, S.meta.tutor);
  campo(M.data, S.meta.data ? new Date(S.meta.data + "T12:00").toLocaleDateString("it-IT") : "");
  testo(M.compH, { size:11, style:"bold", color:[23,63,79] });
  const cw = LW / 3;
  const riga = (vals, testa) => { pagina(8); vals.forEach((v, i) => {
    if (testa){ d.setFillColor(241,245,248); d.rect(MX + i * cw, y, cw, 7.5, "F"); }
    d.setDrawColor(203,213,223); d.rect(MX + i * cw, y, cw, 7.5);
    d.setFont("Figtree", testa ? "bold" : "normal"); d.setFontSize(9.5); d.setTextColor(31,41,55);
    d.text(d.splitTextToSize(v || "", cw - 4)[0] || "", MX + i * cw + 2, y + 5); }); y += 7.5; };
  riga([M.cognome, M.nome, M.matricola], true);
  S.members.forEach(m => riga([m.surname, m.name, m.studentId]));
  y += 5;
  campo(M.articolo, articoliUsati().join("; "));
  pagina(20);
  const ym = y; testo(M.metodoH + " " + M.metodo, { size:9.5, x:MX + 4, w:LW - 8, gap:0 });
  d.setFillColor(199,149,52); d.rect(MX, ym, 1.4, y - ym, "F"); y += 4;
  M.legenda.forEach(([l, n, ds]) => testo(`${n}: ${ds}`, { size:9.5, gap:.5 }));
  y += 4;
  pagina(30);
  testo(M.matrice, { size:14, style:"bold", color:[23,63,79], gap:3 });
  COMP.forEach(c => {
    const v = S.c[c.n], col = COL[c.a];
    pagina(40);
    d.setFillColor(...col); d.rect(MX, y, LW, 1.6, "F"); y += 5;
    d.roundedRect(MX, y, 13, 10, 2, 2, "F");
    d.setFont("Figtree", "bold"); d.setFontSize(11); d.setTextColor(255,255,255); d.text("C" + c.n, MX + 6.5, y + 6.6, { align:"center" });
    const y0 = y;
    testo(AREE[c.a].nome.toUpperCase(), { size:8, style:"bold", color:col, x:MX + 17, w:LW - 17, gap:.5 });
    testo(c.t, { size:12, style:"bold", x:MX + 17, w:LW - 17, gap:2 });
    y = Math.max(y, y0 + 12);
    [[M.fIN, v.in_corr, v.in_evid], [M.fCCNL + (v.arts.length ? ": " + v.arts.map(corto).join(", ") : ""), v.ccnl_corr, v.ccnl_evid]].forEach(([f, corr, ev]) => {
      testo(f, { size:10.5, style:"bold", gap:1 });
      campo(M.corr, corr); campo(M.evid, ev);
    });
    campo(M.mot, v.mot);
    y += 3;
  });
  pagina(30);
  testo(M.sintH, { size:14, style:"bold", color:[23,63,79], gap:3 });
  M.sint.forEach(([k, , t, pr]) => { pagina(24); testo(t, { size:11, style:"bold", gap:1 }); testo(pr, { size:9, color:[95,107,122], gap:1 }); campo("", S.sint[k]); });
  pagina(24);
  y += 3;
  testo(M.notaH + " " + M.nota, { size:8.5, color:[75,85,99] });
  return d;
}
async function generaPDF(){
  const b = $("#b-pdf"); b.disabled = true;
  try {
    const d = costruisciPDF();
    const nome = "Confronto competenze" + (S.meta.gruppo ? " - " + S.meta.gruppo.replace(/[\\/:*?"<>|]/g, "") : "") + ".pdf";
    const blob = d.output("blob");
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl){ try { await dl.save({ filename:nome, data:blob }); } catch(e){} }
    else { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
    coriandoli();
  } finally { b.disabled = false; }
}
